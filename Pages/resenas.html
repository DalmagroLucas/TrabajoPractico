<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GENX - Reseñas</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>

    <header class="stl-header">
        <div class="logo-contenedor">
            <span class="logo-icono">🎮</span>
            <span class="logo-texto">GENX</span>
        </div>

        <button id="btn-menu" class="btn-menu">☰</button>

        <nav id="nav-links" class="nav-links">
            <a href="inicio.html">Inicio</a>
            <a href="resenas.html">Reseñas</a>

            <a href="tus_resenas.html" class="link-login">Tus reseñas</a>
            <button id="btn-logout" class="boton-tema">Cerrar Sesión</button>

            <a href="crear_usuario.html" class="link-nologin">Registrate</a>
            <a href="inicio_sesion.html" class="link-nologin">Inicia Sesion</a>

            <button id="boton-tema" class="boton-tema" title="Cambiar a modo claro/oscuro">Claro</button>
        </nav>
    </header>

    <main class="contenedor-principal mn-pg" >
        
        <h1 class="tt-pg">Ver las ultimas reseñas</h1>

        <div class="contenedor-filtros" id="barra-filtros">
            <input 
                type="text" 
                id="buscador-texto" 
                placeholder="titulo de reseña" >
            <select id="filtro-juego">
                <option value="">Todos los juegos</option>
            </select>
            <select id="filtro-tag">
                <option value="">Todos los tags</option>
            </select>

            <select id="filtro-calificacion">
                <option value="">Todas las estrellas</option>
                <option value="5">★ 5 - Excelente</option>
                <option value="4">★ 4 - Muy buena</option>
                <option value="3">★ 3 - Buena</option>
                <option value="2">★ 2 - Regular</option>
                <option value="1">★ 1 - Mala</option>
            </select>

            <button id="btn-limpiar">
                Limpiar
            </button>
        </div>

        <div id="contenedor-resenas" class="grid-tarjetas"></div>
    </main>
    
    <script src="../app.js"></script>
</body>
</html>
