<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GENX - Crear Usuario</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <!-- Barra superior -->
    <header class="stl-header">
        <div class="logo-contenedor">
            <span class="logo-icono">🎮</span>
            <span class="logo-texto">GENX</span>
        </div>
        <nav class="nav-links">
            <a href="inicio.html">Inicio</a>
            <a href="resenas.html">Reseñas</a>
            <a href="formulario.html">Crear</a>
            <a href="crear_usuario.html">Registrate</a>
            <a href="inicio_sesion.html">Inicia Sesion</a>
            <button id="boton-tema" class="boton-tema" title="Cambiar a modo claro/oscuro">Claro</button>
        </nav>
    </header>

    
    <main class="login-contenedor">
        <section class="login-panel">
            <h1>Crear Cuenta</h1>
            <form id="formulario-registro">
                <div class="form-group">
                    <label for="reg-usuario">Nombre de usuario:</label>
                    <input
                        id="reg-usuario" 
                        name="usuario"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="reg-contrasena">Contraseña:</label>
                    <input 
                        type="password" 
                        id="reg-contrasena" 
                        name="contrasena"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="reg-confirmar-contrasena">Confirmar contraseña:</label>
                    <input 
                        type="password" 
                        id="reg-confirmar-contrasena" 
                        name="confirmar-contrasena"
                        required
                    >
                </div>

                <p id="mensaje-registro" class="mj-er"></p>

                <button type="submit" class="boton-login">Crear Usuario</button>
            </form>

            <p style="margin-top: 15px; text-align: center;">
                ¿Ya tienes una cuenta? <a href="inicio_sesion.html">Inicia sesión aquí</a>
            </p>
        </section>
    </main>

    <script src="../app.js"></script>
</body>
</html>
