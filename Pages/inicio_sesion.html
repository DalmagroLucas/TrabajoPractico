<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GENX - Inicio de sesión</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <!-- Barra superior -->
    <header class="stl-header">
        <div class="logo-contenedor">
            <span class="logo-icono">🎮</span>
            <span class="logo-texto">GENX</span>
        </div>
        <nav class="nav-links">
            <a href="inicio.html">Inicio</a>
            <a href="resenas.html">Reseñas</a>

            <!--Solo se muestra si esta logueado-->
            <a href="formulario.html" class="link-login">Crear</a>
            <a href="perfil.html" class="link-login">Perfil</a>
            <button id="btn-logout" class="boton-tema">Cerrar Sesión</button>

            <!--Solo se muestra si no esta logueado-->
            <a href="crear_usuario.html" class="link-nologin">Registrate</a>
            <a href="inicio_sesion.html" class="link-nologin">Inicia Sesion</a>

            <!--Se muestra en cualquier caso, igual que losa dso de arriba-->
            <button id="boton-tema" class="boton-tema" title="Cambiar a modo claro/oscuro">Claro</button>
        </nav>
    </header>

    <main class="login-contenedor">
        <section class="login-panel">

            <h1>Inicio de sesión</h1>
            <form id="formulario-login">
                <div class="form-group">
                    <label for="usuario">Usuario:</label>
                    <input
                        id="usuario"
                        name="usuario"
                        required
                    >
                </div>
                <div class="form-group">
                    <label for="contrasena">Contraseña:</label>
                    <div style="position: relative; display: flex; align-items: center;">
                        <input 
                            type="password"
                            id="contrasena"
                            name="contrasena"
                            required
                            style="width: 100%; padding-right: 35px;" 
                        >
                        <button type="button" id="btn-ver-contrasena" style="position: absolute; right: 5px; background: none; border: none; cursor: pointer; font-size: 1.2em;" title="Mostrar/Ocultar contraseña">
                        👁️
                        </button>
                    </div>
                </div>
                

                <p id="mensaje-login" class="mj-er"></p>

                <button type="submit" class="boton-login">Iniciar sesión</button>
            </form>
        </section>
    </main>
    
    <script src="/app.js"></script>

</body>
</html>
