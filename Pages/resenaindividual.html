<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GENX - Inicio</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <!--Barra superior-->
    <header class="stl-header">
        <div class="logo-contenedor">
            <span class="logo-icono">🎮</span>
            <span class="logo-texto">GENX</span>
        </div>

        <button id="btn-menu" class="btn-menu">☰</button>

        <nav id="nav-links" class="nav-links">
            <a href="inicio.html">Inicio</a>
            <a href="resenas.html">Reseñas</a>

            <!--Solo se muestra si esta logueado-->
            <a href="formulario.html" class="link-login">Crear</a>
            <a href="perfil.html" class="link-login">Perfil</a>
            <button id="btn-logout" class="boton-tema">Cerrar Sesión</button>

            <!--Solo se muestra si no esta logueado-->
            <a href="crear_usuario.html" class="link-nologin">Registrate</a>
            <a href="inicio_sesion.html" class="link-nologin">Inicia Sesion</a>

            <!--Se muestra en cualquier caso, igual que losa dso de arriba-->
            <button id="boton-tema" class="boton-tema" title="Cambiar a modo claro/oscuro">Claro</button>
        </nav>
    </header>

    <main class="contenedor-principal mn-pg">
        <div id="detalle-resena" style="margin-bottom: 30px;">
        </div>
        <div class="tarjeta-formulario" style="margin-bottom: 20px;">
            <h3 style="color: white;">Deja tu comentario</h3>
            <textarea id="input-comentario" rows="4" placeholder="Escribe tu comentario aquí..." style="width: 100%; border-radius: 8px; padding: 10px;"></textarea>
            <button id="btn-comentar" class="boton-publicar" style="margin-top: 10px;">Comentar</button>
        </div>

        <!-- Rectángulo rojo: Resto de los comentarios -->
        <div id="contenedor-comentarios" style="background-color: #ff0000; padding: 20px; border-radius: 10px; min-height: 100px;">
            <h3 style="color: white;">Comentarios</h3>
            <!-- Los comentarios se insertarán aquí -->
        </div>
    </main>
    <script src="/app.js"></script>
    
</body>
</html>
