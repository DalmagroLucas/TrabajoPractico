<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GENX - Crear Reseña</title>
    <!-- CAMBIO REALIZADO: Se ajustó la ruta al CSS saliendo de /Pages/ con ../style.css -->
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <!-- Barra superior -->
    <header class="barra-navegacion">
        <div class="logo-contenedor">
            <span class="logo-icono">🎮</span>
            <span class="logo-texto">GENX</span>
        </div>
        <nav class="nav-links">
            <a href="inicio.html">Inicio</a>
            <a href="resenas.html">Reseñas</a>
            <a href="formulario.html">Crear</a>
            <a href="crear_usuario.html">Registrate</a>
            <a href="inicio_sesion.html">Inicia Sesion</a>
            <button id="boton-tema" class="boton-tema" title="boton que cambia de claro a oscuro o viceversa">Claro</button>
        </nav>
    </header>

    <!--Pagina para crear una reseña-->
    <main class="contenedor-principal">
        <div class="tarjeta-formulario">
            <form id="formulario-juego">
                
                <div class="filas-formulario">
                    
                    <!-- COLUMNA IZQUIERDA: Caja de Imagen y Tags -->
                    <div class="columna-izquierda">
                        
                        <!-- CAMBIO REALIZADO: Estructura corregida para que la imagen se aprecie sin bloqueos -->
                        <div class="caja-subir-imagen" id="caja-imagen">
                            <input type="file" id="imagen-juego" name="imagen-juego" accept="image/*" required>
                            <div class="preview-placeholder" id="preview-placeholder">
                                <span>+ Subir Imagen</span>
                            </div>
                            <img id="imagen-preview" src="" alt="Vista previa" class="oculto">
                        </div>

                        <div class="grupo-form">
                            <label for="tag-input">Tags</label>
                            <input type="text" id="tag-input" list="opciones-tags" placeholder="Escribe o selecciona tag..." autocomplete="off">
                            <datalist id="opciones-tags"></datalist>
                            <div id="contenedor-tags" class="contenedor-tags"></div>
                        </div>

                    </div>

                    <!-- COLUMNA DERECHA: Reseña, Juego, Opinión y Estrellas -->
                    <div class="columna-derecha">
                        
                        <div class="grupo-form">
                            <label for="titulo-resena">Nombre reseña</label>
                            <input type="text" id="titulo-resena" name="titulo-resena" required>
                        </div>

                        <div class="grupo-form">
                            <label for="nombre-juego">Nombre de juego</label>
                            <input type="text" id="nombre-juego" name="nombre-juego" list="opciones-juegos" autocomplete="off" required>
                            <datalist id="opciones-juegos"></datalist>
                        </div>

                        <div class="grupo-form">
                            <label for="opinion">Opinion</label>
                            <textarea id="opinion" name="opinion" rows="4" required></textarea>
                        </div>

                        <!-- CAMBIO REALIZADO: Calificación por Estrellas (★ ★ ★ ★ ★) que se rellenan con un clic -->
                        <div class="grupo-form grupo-calificacion">
                            <label>Calificación</label>
                            <div class="estrellas-calificacion" id="estrellas-calificacion">
                                <span class="estrella-item" data-valor="1">★</span>
                                <span class="estrella-item" data-valor="2">★</span>
                                <span class="estrella-item" data-valor="3">★</span>
                                <span class="estrella-item" data-valor="4">★</span>
                                <span class="estrella-item" data-valor="5">★</span>
                            </div>
                            <!-- value="" para que inicie sin estrellas marcadas -->
                            <input type="hidden" id="calificacion" name="calificacion" value="" required>
                        </div>

                    </div>

                </div>

                <div class="fotor-formulario">
                    <button type="submit" class="boton-publicar">Publicar</button>
                </div>

            </form>
        </div>
    </main>

    <!-- CAMBIO REALIZADO: Se ajustó la ruta al archivo app.js saliendo de /Pages/ con ../app.js -->
    <script src="../app.js"></script>
</body>
</html>
