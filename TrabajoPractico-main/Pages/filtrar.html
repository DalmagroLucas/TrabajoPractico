<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GENX - Filtrar Reseñas</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>

    <!-- BARRA DE NAVEGACIÓN -->
    <header class="barra-navegacion">
        <div class="logo-contenedor">
            <span class="logo-icono">🤪</span>
            <span class="logo-texto">GENX</span>
        </div>
        <nav class="nav-links">
            <a href="inicio.html">Inicio</a>
            <a href="ultimas_reseñas.html">Recientes</a>
            <a href="filtrar.html" class="activo">Filtrar</a>
            <a href="formulario.html">Crear</a>
            <button id="boton-tema" class="boton-tema" title="Cambiar a modo claro/oscuro">Claro</button>
        </nav>
    </header>

    <!-- CONTENIDO PRINCIPAL CENTRADO VERTICALMENTE (column) -->
    <main class="contenedor-principal" style="max-width: 1100px; margin: 40px auto; padding: 0 20px; display: flex; flex-direction: column; align-items: center;">
        
        <!-- TÍTULO PRINCIPAL BIEN CENTRADO -->
        <h1 style="text-align: center; margin-bottom: 30px; font-size: 2.2rem; width: 100%;">Buscar y Filtrar Reseñas</h1>

        <!-- BARRA DE FILTROS EN UNA SOLA LÍNEA HORIZONTAL -->
        <div class="contenedor-filtros" style="display: flex; flex-direction: row; align-items: center; justify-content: center; gap: 15px; width: 100%; max-width: 1000px; margin-bottom: 40px; flex-wrap: nowrap;">
            
            <!-- 1. Búsqueda por Título -->
            <input 
                type="text" 
                id="buscador-texto" 
                placeholder="Buscar por título de reseña..." 
                style="flex: 2; padding: 12px 18px; border: 1.5px solid #000; border-radius: 25px; font-size: 0.95rem; outline: none; background: white;"
            >

            <!-- 2. Select Juegos -->
            <select 
                id="filtro-juego-select" 
                style="flex: 1.5; padding: 12px 18px; border: 1.5px solid #000; border-radius: 25px; font-size: 0.95rem; outline: none; background: white; cursor: pointer;"
            >
                <option value="">Todos los juegos</option>
            </select>

            <!-- 3. Select Tags -->
            <select 
                id="filtro-tag-select" 
                style="flex: 1.5; padding: 12px 18px; border: 1.5px solid #000; border-radius: 25px; font-size: 0.95rem; outline: none; background: white; cursor: pointer;"
            >
                <option value="">Todos los tags</option>
            </select>

            <!-- 4. Select Calificación -->
            <select 
                id="filtro-calificacion" 
                style="flex: 1.2; padding: 12px 18px; border: 1.5px solid #000; border-radius: 25px; font-size: 0.95rem; outline: none; background: white; cursor: pointer;"
            >
                <option value="">Todas las estrellas</option>
                <option value="5">★ 5 - Excelente</option>
                <option value="4">★ 4 - Muy buena</option>
                <option value="3">★ 3 - Buena</option>
                <option value="2">★ 2 - Regular</option>
                <option value="1">★ 1 - Mala</option>
            </select>

            <!-- Botón Limpiar -->
            <button 
                id="btn-limpiar-filtros" 
                style="padding: 12px 22px; border: 1.5px solid #000; border-radius: 25px; background: #e0e0e0; font-weight: bold; cursor: pointer; white-space: nowrap;"
            >
                Limpiar
            </button>
        </div>

        <!-- CONTENEDOR DE RESEÑAS (ABAJO DE LOS FILTROS) -->
        <div id="contenedor-resenas" class="grid-resenas" style="width: 100%;"></div>

    </main>

    <script src="../app.js"></script>
</body>
</html>
